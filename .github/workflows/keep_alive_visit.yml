name: Keep Alive (Selenium Visit)

on:
  schedule:
    - cron: "0 */6 * * *"    # 6시간마다
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Selenium
        run: pip install selenium

      - name: Visit app
        env:
          STREAMLIT_APP_URL: "https://testaiassistant-jdv8q6orakadqqrvcg6vgh.streamlit.app/"
        run: python .github/scripts/wake_app.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png